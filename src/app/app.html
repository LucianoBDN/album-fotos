
@if (!proposal.initialized() || !auth.initialized()) {
  <main class="app-loading" aria-label="Cargando"></main>
} @else if (showProposal()) {
  <app-proposal />
} @else {
  <app-navigation/>
  <app-relationship-counter />
  <router-outlet />
}

@if (showInstallPrompt()) {
  <aside class="install-popup" role="dialog" aria-label="Instalar Nuestra Álbum">
    <button type="button" class="install-popup-close" (click)="dismissInstallPrompt()" aria-label="Cerrar">×</button>
    <span class="install-popup-icon" aria-hidden="true">♡</span>
    <div class="install-popup-content">
      <strong>Guardá Nuestra Álbum</strong>
      <span>Instalala para abrirla como una app.</span>
    </div>
    <button type="button" class="install-popup-button" (click)="installApp()">Instalar</button>
  </aside>
}
